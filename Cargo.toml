[workspace]
members = [
    "kernel/domain",
    "kernel/adapters/nvml",
    "kernel/adapters/metal",
    "kernel/adapters/tpu",
    "kernel/adapters/ebpf",
    "kernel/adapters/procfs",
    "validation/app",
    "validation/policies",
    "presentation/tui",
    "presentation/api",
    "presentation/cli",
    "proof/attestation",
    "proof/telemetry",
    # "ebpf-programs",  # Built separately with cargo-bpf
]
resolver = "2"

[workspace.package]
name = "tensor-guardian"
version = "0.1.0"
edition = "2021"
authors = ["tensor-guardian contributors"]
license = "MIT"
repository = "https://github.com/MChorfa/tensor-guardian"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
    "fs",
] }
async-trait = "0.1"
futures = "0.3"

# Error handling
anyhow = "1"
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "fmt",
] }
opentelemetry = "0.23"
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }
opentelemetry-stdout = { version = "0.5", features = [
    "metrics",
    "trace",
    "logs",
] }
opentelemetry-otlp = { version = "0.17", features = [
    "grpc-tonic",
    "trace",
    "metrics",
    "logs",
] }
tracing-opentelemetry = "0.25"
metrics = "0.24"

# Time handling
chrono = { version = "0.4", features = ["serde", "now"] }
uuid = { version = "1", features = ["v4", "serde"] }

# eBPF
aya = { version = "0.13", default-features = false }
aya-ebpf = "0.1"
aya-ebpf-bindings = "0.1"
aya-log = { version = "0.1.13", default-features = false }
aya-log-ebpf = "0.1"

# Networking / Protocols
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
hyper = { version = "1", features = ["full"] }
tower = "0.5"

# gRPC / OpenAPI generation (Buf v2 ecosystem)
pbjson = "0.7"
pbjson-types = "0.7"

# Hardware interfaces
nvml-wrapper = "0.11"

# TUI
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
directories = "5"

# Evidence / Attestation
sha2 = "0.10"
ring = "0.17"
base64 = "0.22"
in-toto = "0.3"

# Testing
mockall = "0.13"
tokio-test = "0.4"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
