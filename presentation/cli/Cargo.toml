[package]
name = "tensor-guardian-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface for tensor-guardian"

[[bin]]
name = "tensor-guardian"
path = "src/main.rs"

[dependencies]
# Domain & App
tensor-guardian-domain = { path = "../../kernel/domain" }
tensor-guardian-app = { path = "../../validation/app" }

# Adapters
tensor-guardian-adapter-nvml = { path = "../../kernel/adapters/nvml", optional = true }
tensor-guardian-adapter-metal = { path = "../../kernel/adapters/metal", optional = true }
tensor-guardian-adapter-tpu = { path = "../../kernel/adapters/tpu", optional = true }
tensor-guardian-adapter-ebpf = { path = "../../kernel/adapters/ebpf", optional = true }

# NVML (for direct health checks)
nvml-wrapper = { workspace = true, optional = true }

# Presentation
tensor-guardian-tui = { path = "../tui" }
tensor-guardian-telemetry = { path = "../../proof/telemetry" }

# Workspace deps
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[features]
default = ["nvml", "tui"]
nvml = ["dep:tensor-guardian-adapter-nvml", "dep:nvml-wrapper"]
metal = ["dep:tensor-guardian-adapter-metal"]
tpu = ["dep:tensor-guardian-adapter-tpu"]
ebpf = ["dep:tensor-guardian-adapter-ebpf"]
tui = []
headless = []
