[package]
name = "tensor-guardian-ebpf-programs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "eBPF programs for tensor-guardian kernel instrumentation"

[dependencies]
aya-ebpf = { workspace = true }
aya-ebpf-bindings = { workspace = true }
aya-log-ebpf = { workspace = true }

[build-dependencies]
which = { version = "6.0.0", default-features = false }

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[lib]
name = "tensor_guardian_ebpf"
path = "src/lib.rs"

[[bin]]
name = "gpu-events"
path = "src/gpu_events/main.rs"

[[bin]]
name = "io-trace"
path = "src/io_trace/main.rs"

[[bin]]
name = "memory-pressure"
path = "src/memory_pressure/main.rs"
